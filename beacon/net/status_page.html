<!doctype html>
<meta charset="utf-8">
<title>Huddle beacon</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 24px; background: #111; color: #ddd; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 18px 0 6px; color: #aaa; }
  .sub { color: #888; margin-bottom: 8px; }
  table { border-collapse: collapse; }
  td, th { padding: 3px 14px 3px 0; text-align: left; font-variant-numeric: tabular-nums; }
  th { color: #888; font-weight: normal; }
  .up { color: #3c3; } .down { color: #e55; } .warn { color: #e95; }
  code { color: #9cf; }
</style>
<h1 id="title">Huddle beacon</h1>
<div class="sub" id="sub">loading…</div>
<div class="sub" id="identity"></div>
<h2>Peers (mutual TLS)</h2>
<table><thead><tr><th>Peer</th><th>Certificate</th><th>State</th><th>Last answer</th><th>Failures</th></tr></thead><tbody id="peers"></tbody></table>
<h2>Roster (venue channel)</h2>
<table><thead><tr><th>Beacon</th><th>Address</th><th>Key</th></tr></thead><tbody id="roster"></tbody></table>
<div class="sub warn" id="revoked"></div>
<h2>Groups</h2>
<table><thead><tr><th>Group</th><th>Members writing</th><th>Records</th></tr></thead><tbody id="groups"></tbody></table>
<h2>Recent records</h2>
<table><thead><tr><th>Arrived</th><th>Channel</th><th>Type</th><th>Signer</th><th>Seq</th><th>Content</th><th>Bytes</th></tr></thead><tbody id="recent"></tbody></table>
<script>
  const rows = (id, items, cells) => {
    document.getElementById(id).innerHTML = items.map((i) => `<tr>${cells(i).map((c) => `<td>${c}</td>`).join("")}</tr>`).join("");
  };
  const ago = (s) => (s === null ? "never" : `${s.toFixed(1)} s ago`);
  const hex = (h) => `<code>${h.slice(0, 8)}…</code>`;
  const content = (r) => (r.enc === null ? "venue" : r.enc ? "encrypted" : "plain");
  async function refresh() {
    try {
      const [s, recent] = await Promise.all([fetch("/status").then((r) => r.json()), fetch("/dev/recent").then((r) => r.json())]);
      document.getElementById("title").textContent = `${s.beacon} (venue ${s.venue_id})`;
      document.getElementById("sub").innerHTML = `${s.records} records · digest <code>${s.digest}</code> · ${s.conflicts} conflicts · up ${s.uptime_s} s`;
      document.getElementById("identity").innerHTML = `key ${hex(s.key)} · peers reach it at <code>${s.url}</code>`;
      rows("peers", s.peers, (p) => [p.url, p.name || "?", p.up ? '<span class="up">up</span>' : '<span class="down">down</span>', ago(p.last_ok_s_ago), p.failures]);
      rows("roster", s.roster, (e) => [e.beacon, `<code>${e.url}</code>`, `<code>${e.key}…</code>`]);
      document.getElementById("revoked").textContent = s.revoked.length ? `revoked: ${s.revoked.join(", ")}` : "";
      rows("groups", Object.entries(s.groups), ([id, g]) => [hex(id), g.members_writing, g.held]);
      rows("recent", recent, (r) => [ago(r.arrived_s_ago), r.channel === "0".repeat(32) ? "venue" : hex(r.channel), r.type, hex(r.signer), r.seq, content(r), r.bytes]);
    } catch (e) {
      document.getElementById("sub").textContent = `not answering (${e})`;
    }
  }
  refresh();
  setInterval(refresh, 1000);
</script>
