[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huddle-beacon"
version = "0.1.0"
description = "Huddle beacon: stores signed group records and gossips them to other beacons"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5",
    "cbor2>=5.6",
    "aiohttp>=3.9",
    "cryptography>=42",
    "zeroconf>=0.132",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["beacon*"]

[tool.setuptools.package-data]
"beacon.net" = ["*.html"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["beacon"]

[[tool.mypy.overrides]]
module = ["nacl.*", "cbor2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
